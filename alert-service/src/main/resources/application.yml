server:
  port: 8093

spring:
  application:
    name: alert-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-alerts
      auto-offset-reset: earliest
  datasource:
    url: jdbc:h2:mem:alertdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sharath.sentinel.alerts: INFO
    org.apache.kafka: WARN
