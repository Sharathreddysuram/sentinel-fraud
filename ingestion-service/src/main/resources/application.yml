server:
  port: 8091

spring:
  application:
    name: ingestion-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sharath.sentinel.ingestion: INFO
    org.apache.kafka: WARN
